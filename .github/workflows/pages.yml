# Publishes the book to GitHub Pages on every push to main.
# index.html is written without <!doctype> (the claude.ai Artifact publisher adds its own skeleton),
# so here we prepend the doctype to get standards mode; the leading <meta>/<title>/<link>/<style>
# land in <head> automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp -R stories stories.js _site/
          { echo '<!doctype html>'; cat index.html; } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
